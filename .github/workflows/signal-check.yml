name: Gold Signal Check

on:
  schedule:
    # Alle 5 Minuten (GitHub kann das leicht verzögern, ist aber für
    # Signal-Benachrichtigungen völlig ausreichend)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten zum Testen

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal check
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_EPIC: ${{ secrets.CAPITAL_EPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_check.py
