name: Gold Signal Check

on:
  schedule:
    # Bspw. alle 5 Minuten (oder passend zu deinem Intervall)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Erlaubt das manuelle Ausführen per Button

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python signal_check.py
