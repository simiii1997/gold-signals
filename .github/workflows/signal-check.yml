name: Gold Signal Check 1M

on:
  schedule:
    # Startet alle 5 Minuten einen Runner
    - cron: '*/5 * * * *'
  workflow_dispatch: # Erlaubt auch das manuelle Starten per Button

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run signal check every single minute
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Führt das Skript 5-mal im Abstand von exakt 60 Sekunden aus
          for i in {1..5}; do
            echo "=== Minute $i von 5 ==="
            python signal_check.py
            if [ $i -lt 5 ]; then
              sleep 60
            fi
          done
